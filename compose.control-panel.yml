services:
  control-panel:
    build:
      context: .
      dockerfile: control-panel/Dockerfile
    container_name: company-control-panel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./reproxy.yml:/app/reproxy.yml:ro
      - ./control-panel/data:/app/data
    env_file:
      - control-panel/.env
    environment:
      CONTROL_PANEL_ADDR: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8090:8090"
